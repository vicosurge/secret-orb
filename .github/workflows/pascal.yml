name: Pascal Build

on:
  push:
    branches: [ "main" ]
    paths:
      - 'pascal/**'
      # webtest evaluates web/editor.html's own file layer and checks it
      # against the Pascal one, so a change there has to run this workflow.
      - 'web/**'
      - '.github/workflows/pascal.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'pascal/**'
      - 'web/**'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Free Pascal
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc

      # secorb.pas is the DOS 8.3 duplicate driven by BUILD.BAT. If it drifts
      # from secretorb.pas the FreeDOS build silently diverges.
      - name: Check DOS 8.3 duplicate is in step
        working-directory: pascal
        run: diff secretorb.pas secorb.pas

      - name: Build Linux binaries
        working-directory: pascal
        run: |
          mkdir -p bin
          fpc -O2 -XX -CX -Xs -Fusrc -obin/secretorb secretorb.pas
          fpc -O2 -XX -CX -Xs -Fusrc -obin/editor editor.pas
          echo "Building Turbo Vision editor (verification only)..."
          fpc -O2 -XX -CX -Xs -Fusrc -obin/editor-tv editor-tv.pas
          echo "Building the development tools (verification only)..."
          fpc -O2 -XX -CX -Xs -Fusrc -obin/converter tools/converter.pas
          fpc -O2 -XX -CX -Xs -Fusrc -obin/validate tools/validate.pas
          fpc -O2 -XX -CX -Xs -Fusrc -obin/bpldump tools/bpldump.pas

      # pairtest, eventtest and parsetest, then webtest - which evaluates
      # web/editor.html's own reader and writer under Node and makes the
      # Pascal agree with the bytes it produced. Ubuntu runners ship Node, so
      # the skip path in that target should never be taken here.
      - name: Run unit tests
        working-directory: pascal
        run: make test

      # The shipped world must stay completable: every room reachable, a win
      # condition that can actually be met, no dangling references.
      - name: Validate the shipped world
        working-directory: pascal
        run: bin/validate data/world.dat

      # Saving the same world twice must produce the same bytes, or world files
      # diff noisily and cannot be checksummed.
      - name: Check world files are byte-reproducible
        working-directory: pascal
        run: |
          bin/converter data/world.dat /tmp/a.dat
          bin/converter data/world.dat /tmp/b.dat
          cmp /tmp/a.dat /tmp/b.dat
          bin/converter /tmp/a.dat /tmp/c.dat
          bin/converter /tmp/c.dat /tmp/d.dat
          cmp /tmp/c.dat /tmp/d.dat

      - name: Package Linux build
        working-directory: pascal
        run: |
          mkdir -p dist/secretorb-linux
          cp bin/secretorb bin/editor dist/secretorb-linux/
          cp data/world.dat dist/secretorb-linux/
          tar -czf secretorb-linux-x64.tar.gz -C dist secretorb-linux

      - name: Check binary sizes
        working-directory: pascal
        run: |
          echo "=== Binary sizes ==="
          ls -lh bin/
          echo ""
          echo "=== 720KB floppy check ==="
          TOTAL=$(du -cb bin/secretorb bin/editor data/world.dat | tail -1 | cut -f1)
          echo "Total size: $TOTAL bytes"
          if [ $TOTAL -lt 737280 ]; then
            echo "PASS: Fits on 720KB floppy (737280 bytes)"
          else
            echo "WARN: Exceeds 720KB floppy capacity"
          fi

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: secretorb-linux-x64
          path: pascal/secretorb-linux-x64.tar.gz

  build-windows:
    runs-on: windows-latest
    env:
      FPC_VERSION: "3.2.2"
      FPC_DIR: "C:\\fpc"
    steps:
      - uses: actions/checkout@v4

      - name: Install Free Pascal
        shell: pwsh
        run: |
          # Use the installer from the repository
          $installer = "fpc-${{ env.FPC_VERSION }}.i386-win32.exe"

          Write-Host "Running FPC installer in silent mode..."
          Write-Host "Installer: $installer"

          # Run installer silently, install to C:\fpc
          Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/DIR=${{ env.FPC_DIR }}", "/NORESTART" -Wait -NoNewWindow

          Write-Host "Installation complete. Contents of ${{ env.FPC_DIR }}:"
          Get-ChildItem -Path ${{ env.FPC_DIR }} -Depth 1 | Select-Object Name

      - name: Verify FPC installation
        shell: pwsh
        run: |
          Write-Host "Looking for fpc.exe in ${{ env.FPC_DIR }}..."

          # Check expected location first
          $expectedPath = "${{ env.FPC_DIR }}\bin\i386-win32\fpc.exe"
          if (Test-Path $expectedPath) {
            Write-Host "Found at expected location: $expectedPath"
            & $expectedPath -iV
            "${{ env.FPC_DIR }}\bin\i386-win32" | Out-File -FilePath fpc_path.txt -Encoding utf8
          } else {
            # Search for it
            $fpc = Get-ChildItem -Path ${{ env.FPC_DIR }} -Recurse -Filter "fpc.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($fpc) {
              Write-Host "Found: $($fpc.FullName)"
              & $fpc.FullName -iV
              $fpc.DirectoryName | Out-File -FilePath fpc_path.txt -Encoding utf8
            } else {
              Write-Host "ERROR: fpc.exe not found!"
              Write-Host "Directory contents:"
              Get-ChildItem -Path ${{ env.FPC_DIR }} -Recurse | Select-Object FullName
              exit 1
            }
          }

      - name: Build Windows binaries
        working-directory: pascal
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null

          # Use FPC from known install location
          $fpcExe = "${{ env.FPC_DIR }}\bin\i386-win32\fpc.exe"

          Write-Host "Using FPC: $fpcExe"
          Write-Host "FPC exists: $(Test-Path $fpcExe)"

          if (-not (Test-Path $fpcExe)) {
            Write-Host "ERROR: FPC not found at expected path"
            Write-Host "Searching for fpc.exe..."
            Get-ChildItem -Path ${{ env.FPC_DIR }} -Recurse -Filter "fpc.exe" | Select-Object FullName
            exit 1
          }

          Write-Host "Compiling secretorb.pas..."
          & $fpcExe -O2 -XX -CX -Xs -Fusrc -obin\secretorb.exe secretorb.pas
          $exitCode1 = $LASTEXITCODE
          Write-Host "Exit code: $exitCode1"

          Write-Host "Compiling editor.pas..."
          & $fpcExe -O2 -XX -CX -Xs -Fusrc -obin\editor.exe editor.pas
          $exitCode2 = $LASTEXITCODE
          Write-Host "Exit code: $exitCode2"

          Write-Host "Compiling editor-tv.pas (verification only)..."
          & $fpcExe -O2 -XX -CX -Xs -Fusrc -obin\editor-tv.exe editor-tv.pas
          $exitCode3 = $LASTEXITCODE
          Write-Host "Exit code: $exitCode3"

          Write-Host "Contents of bin directory:"
          Get-ChildItem -Path bin -ErrorAction SilentlyContinue | Select-Object Name, Length

          if ($exitCode1 -ne 0) { exit $exitCode1 }
          if ($exitCode2 -ne 0) { exit $exitCode2 }
          if ($exitCode3 -ne 0) { exit $exitCode3 }

      - name: Package Windows build
        working-directory: pascal
        shell: pwsh
        run: |
          Write-Host "Checking bin directory..."
          Get-ChildItem -Path bin -ErrorAction SilentlyContinue

          # FPC creates files without .exe extension, rename them
          # Use Move-Item instead of Rename-Item to avoid PowerShell path issues
          if (Test-Path bin\secretorb) {
            Move-Item -Path bin\secretorb -Destination bin\secretorb.exe -Force
          }
          if (Test-Path bin\editor) {
            Move-Item -Path bin\editor -Destination bin\editor.exe -Force
          }

          if (-not (Test-Path bin\secretorb.exe)) {
            Write-Host "ERROR: secretorb.exe not found after rename!"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path dist\secretorb-win | Out-Null
          Copy-Item bin\secretorb.exe dist\secretorb-win\
          Copy-Item bin\editor.exe dist\secretorb-win\
          Copy-Item data\world.dat dist\secretorb-win\
          Compress-Archive -Path dist\secretorb-win -DestinationPath secretorb-win32.zip

      - name: Check binary sizes
        working-directory: pascal
        shell: pwsh
        run: |
          Write-Host "=== Binary sizes ==="
          Get-ChildItem bin\*.exe | Format-Table Name, Length
          $total = (Get-ChildItem bin\*.exe | Measure-Object -Property Length -Sum).Sum
          $total += (Get-Item data\world.dat).Length
          Write-Host "Total size: $total bytes"
          if ($total -lt 737280) {
            Write-Host "PASS: Fits on 720KB floppy"
          } else {
            Write-Host "WARN: Exceeds 720KB floppy"
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: secretorb-win32
          path: pascal/secretorb-win32.zip

  build-dos32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # fpc is the host compiler the cross-compiler is built with, and also
      # builds the native tools the DOS run is compared against. qemu, mtools
      # and dosfstools are for the FreeDOS test run and the floppy image.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc qemu-system-x86 mtools dosfstools zip unzip curl
          fpc -iV   # the cross-compiler is built with this; 3.2.2 matches the pinned sources

      # No distribution packages a go32v2 cross-compiler, so we build one from
      # pinned sources. It changes only when dos/versions.sh or the bootstrap
      # script does, hence the cache key: a hit turns a from-source compiler build into a
      # download. Restoring only ~/.cache/secretorb-dos, not the source
      # tarballs under dl/, which the pruning step below drops.
      - name: Cache the go32v2 toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/secretorb-dos
          key: dos-toolchain-${{ runner.os }}-${{ hashFiles('pascal/dos/versions.sh', 'pascal/dos/bootstrap-toolchain.sh') }}

      - name: Build the go32v2 cross-compiler
        working-directory: pascal
        run: dos/bootstrap-toolchain.sh

      - name: Build DOS binaries
        working-directory: pascal
        run: make dos32

      # Boots the binaries on real FreeDOS under QEMU and checks the output of
      # the console tools: that the unit tests still pass under DOS, that the
      # shipped world validates, and that the DOS converter writes byte for
      # byte the same world file as the Linux one.
      - name: Run the DOS tests under FreeDOS
        working-directory: pascal
        run: make dos-test

      # Also builds secretorb-720k.img. If the distribution ever outgrows the
      # 720KB floppy the project is built around, this step fails rather than
      # printing a warning nobody reads.
      - name: Package the DOS build
        working-directory: pascal
        run: make dos-dist

      - name: Check DOS binary sizes
        working-directory: pascal
        run: |
          echo "=== DOS binaries ==="
          ls -lh dist/SECORB/
          echo ""
          echo "=== 720KB floppy image ==="
          mdir -i secretorb-720k.img ::

      # The FPC and djgpp tarballs are 160MB and are only needed for a rebuild
      # from scratch, which a cache hit skips. The FreeDOS image stays: every
      # run of the test harness needs it.
      - name: Prune source tarballs before the cache is saved
        run: rm -f ~/.cache/secretorb-dos/dl/fpcbuild-*.tar.gz ~/.cache/secretorb-dos/dl/djgpp-*.tar.bz2

      - name: Upload DOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: secretorb-dos32
          path: |
            pascal/secretorb-dos32.zip
            pascal/secretorb-720k.img

  release:
    needs: [build-linux, build-windows, build-dos32]
    runs-on: ubuntu-latest
    if: always() && needs.build-linux.result == 'success'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List artifacts
        run: ls -lh

      - name: Upload combined release
        uses: actions/upload-artifact@v4
        with:
          name: secretorb-all-platforms
          path: |
            secretorb-*.tar.gz
            secretorb-*.zip
            secretorb-*.img
          retention-days: 30
